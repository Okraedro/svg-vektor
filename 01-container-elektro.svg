      <circle cx="768" cy="498" r="5"/>
      <circle cx="820" cy="498" r="5"/>
      <circle cx="716" cy="544" r="5"/>
      <circle cx="768" cy="544" r="5"/>
      <circle cx="820" cy="544" r="5"/>
    </g>
  </g>
  <!-- Замок панели -->
  <rect x="844" y="540" width="22" height="22" rx="5" fill="#24313F"/>
  <circle cx="855" cy="551" r="5" fill="#8FA0B1"/>

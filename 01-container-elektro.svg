<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F7FA"/>
      <stop offset="1" stop-color="#DDE5ED"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C3CCD6"/>
      <stop offset="0.35" stop-color="#E8EDF2"/>
      <stop offset="0.7" stop-color="#D5DCE4"/>
      <stop offset="1" stop-color="#ADB8C4"/>
    </linearGradient>
    <linearGradient id="sideG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#87939F"/>
      <stop offset="1" stop-color="#A6B1BC"/>
    </linearGradient>
    <linearGradient id="topG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F7FA"/>
      <stop offset="1" stop-color="#C9D2DB"/>
    </linearGradient>
    <linearGradient id="doorG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DFE5EB"/>
      <stop offset="1" stop-color="#C4CDD7"/>
    </linearGradient>
    <linearGradient id="panelG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B6C0CB"/>
      <stop offset="0.5" stop-color="#DDE3E9"/>
      <stop offset="1" stop-color="#AEB9C4"/>
    </linearGradient>
    <linearGradient id="acG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFDFE"/>
      <stop offset="1" stop-color="#C9D2DB"/>
    </linearGradient>
    <linearGradient id="acSideG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#98A4B0"/>
      <stop offset="1" stop-color="#B4BEC8"/>

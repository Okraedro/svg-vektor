    <circle cx="916" cy="452" r="13" fill="#2E3B4A"/>
    <circle cx="916" cy="452" r="6" fill="#101820"/>
  </g>

  <!-- ===== МОНОБЛОК ОБОГРЕВАТЕЛЬ ===== -->
  <ellipse cx="900" cy="712" rx="215" ry="24" fill="#26323F" opacity="0.14" filter="url(#itemShadow)"/>
  <g>
    <!-- Опоры -->
    <rect x="738" y="698" width="46" height="16" rx="5" fill="#5C6B7A"/>
    <rect x="1024" y="698" width="46" height="16" rx="5" fill="#5C6B7A"/>
    <!-- Корпус -->
    <polygon points="1110,520 1128,496 1128,676 1110,700" fill="#B4BEC8"/>
    <rect x="690" y="520" width="420" height="180" rx="18" fill="#F7F9FB"/>
    <rect x="690" y="520" width="420" height="180" rx="18" fill="none" stroke="#C7D0DA" stroke-width="2"/>
    <polygon points="690,520 1110,520 1128,496 708,496" fill="url(#topG)"/>
    <line x1="692" y1="522" x2="1108" y2="522" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.8"/>
    <!-- Акцентная полоса -->
    <rect x="714" y="682" width="372" height="5" rx="2.5" fill="#ED760E" opacity="0.85"/>
    <!-- Вентилятор -->
    <circle cx="792" cy="610" r="54" fill="#EFF3F7" stroke="#AEBAC6" stroke-width="2.5"/>
    <g stroke="#AEBAC6" stroke-width="4" opacity="0.7">
      <ellipse cx="792" cy="610" rx="42" ry="10"/>
      <ellipse cx="792" cy="610" rx="42" ry="10" transform="rotate(30 792 610)"/>
      <ellipse cx="792" cy="610" rx="42" ry="10" transform="rotate(60 792 610)"/>
      <ellipse cx="792" cy="610" rx="42" ry="10" transform="rotate(90 792 610)"/>
      <ellipse cx="792" cy="610" rx="42" ry="10" transform="rotate(120 792 610)"/>
      <ellipse cx="792" cy="610" rx="42" ry="10" transform="rotate(150 792 610)"/>
    </g>
    <circle cx="792" cy="610" r="11" fill="#8FA0B1"/>
    <circle cx="792" cy="610" r="4" fill="#5C6B7A"/>
    <!-- Панель управления -->
    <rect x="896" y="562" width="166" height="88" rx="10" fill="#E8EDF2" stroke="#C7D0DA" stroke-width="1.5"/>
    <rect x="906" y="576" width="72" height="24" rx="4" fill="#2E3B4A"/>
    <rect x="914" y="584" width="10" height="8" rx="2" fill="#53D769"/>
    <rect x="930" y="584" width="10" height="8" rx="2" fill="#53D769" opacity="0.55"/>
    <rect x="948" y="584" width="8" height="8" rx="2" fill="#53D769" opacity="0.3"/>
    <circle cx="918" cy="624" r="9" fill="#E0453A"/>
    <circle cx="944" cy="624" r="9" fill="#B8C4CF"/>
    <circle cx="970" cy="624" r="9" fill="#B8C4CF"/>
    <circle cx="996" cy="624" r="9" fill="#35B05A"/>
    <circle cx="1022" cy="593" r="10" fill="#F5F7FA" stroke="#AEBAC6" stroke-width="2"/>
    <line x1="1022" y1="587" x2="1022" y2="593" stroke="#4A5A6C" stroke-width="2.5"/>
    <circle cx="1048" cy="624" r="5" fill="#35B05A"/>
    <!-- Блик -->
    <rect x="700" y="528" width="26" height="164" rx="13" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- ===== КОМАНДОКОНТРОЛЛЕР ===== -->
  <ellipse cx="305" cy="702" rx="180" ry="22" fill="#26323F" opacity="0.14" filter="url(#itemShadow)"/>
  <g>
    <!-- Корпус -->
    <polygon points="470,530 498,502 498,667 470,695" fill="url(#sideG)"/>
    <rect x="150" y="530" width="320" height="165" rx="16" fill="url(#bodyG)"/>
    <rect x="150" y="530" width="320" height="165" rx="16" fill="none" stroke="#9AA6B2" stroke-width="2"/>
    <polygon points="150,530 470,530 498,502 178,502" fill="url(#topG)"/>
    <line x1="152" y1="532" x2="468" y2="532" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.8"/>
    <!-- Левый рычаг -->
    <g transform="rotate(-11 255 545)">
      <circle cx="255" cy="548" r="20" fill="#24313F"/>
      <rect x="248" y="502" width="14" height="48" rx="4" fill="#5C6B7A"/>
      <rect x="234" y="458" width="42" height="50" rx="10" fill="#ED760E"/>
      <path d="M234 492 Q255 506 276 492 L276 508 Q255 518 234 508 Z" fill="#C45500"/>
      <rect x="236" y="460" width="10" height="34" rx="5" fill="#FF9A3D"/>
    </g>
    <!-- Правый рычаг -->
    <g transform="rotate(11 345 545)">
      <circle cx="345" cy="548" r="20" fill="#24313F"/>
      <rect x="338" y="502" width="14" height="48" rx="4" fill="#5C6B7A"/>
      <rect x="324" y="458" width="42" height="50" rx="10" fill="#2E3B4A"/>
      <path d="M324 492 Q345 506 366 492 L366 508 Q345 518 324 508 Z" fill="#101820"/>
      <rect x="326" y="460" width="10" height="34" rx="5" fill="#4A5A6C"/>
    </g>
    <!-- Переключатели -->
    <rect x="390" y="524" width="9" height="26" rx="4" fill="#3A4958"/>
    <rect x="417" y="524" width="9" height="26" rx="4" fill="#3A4958"/>
    <!-- Пластина с маркировкой -->
    <rect x="296" y="640" width="78" height="42" rx="4" fill="#F5F7FA" stroke="#AEBAC6" stroke-width="1.5"/>
    <text x="335" y="662" text-anchor="middle" font-size="19" font-weight="bold" fill="#4A5A6C">ККТ</text>
    <text x="335" y="677" text-anchor="middle" font-size="10" fill="#8B97A3">серия</text>
    <circle cx="304" cy="648" r="2.5" fill="#AEBAC6"/>
    <circle cx="366" cy="648" r="2.5" fill="#AEBAC6"/>
    <circle cx="304" cy="674" r="2.5" fill="#AEBAC6"/>
    <circle cx="366" cy="674" r="2.5" fill="#AEBAC6"/>
    <!-- Индикаторы -->
    <circle cx="416" cy="660" r="8" fill="#35B05A"/>
    <circle cx="440" cy="660" r="8" fill="#F2B705"/>
    <circle cx="464" cy="660" r="8" fill="#E0453A"/>
    <circle cx="416" cy="660" r="3" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="440" cy="660" r="3" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="464" cy="660" r="3" fill="#FFFFFF" opacity="0.6"/>
    <!-- Блик -->
    <rect x="158" y="538" width="22" height="150" rx="11" fill="#FFFFFF" opacity="0.4"/>
  </g>

  <!-- ===== РАССЫПАННЫЙ МЕЛКИЙ КРЕПЁЖ ===== -->
  <g>
    <ellipse cx="560" cy="568" rx="22" ry="6" fill="#26323F" opacity="0.12" filter="url(#itemShadow)"/>
    <polygon points="560,550 570,556 570,568 560,574 550,568 550,556" fill="#8E9AA6" stroke="#5C6B7A" stroke-width="1.5"/>
    <ellipse cx="742" cy="512" rx="18" ry="5" fill="#26323F" opacity="0.12" filter="url(#itemShadow)"/>
    <polygon points="742,497 750,502 750,511 742,516 734,511 734,502" fill="#8E9AA6" stroke="#5C6B7A" stroke-width="1.5"/>
    <ellipse cx="512" cy="730" rx="18" ry="5" fill="#26323F" opacity="0.12" filter="url(#itemShadow)"/>
    <polygon points="512,715 520,720 520,729 512,734 504,729 504,720" fill="#8E9AA6" stroke="#5C6B7A" stroke-width="1.5"/>
    <!-- Маленькая шайба -->
    <circle cx="688" cy="536" r="11" fill="none" stroke="#8E9AA6" stroke-width="5"/>
    <!-- Прокладка-кольцо -->
    <circle cx="826" cy="470" r="10" fill="none" stroke="#2E3B4A" stroke-width="7" opacity="0.9"/>

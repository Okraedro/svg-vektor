    <rect x="143" y="194" width="4" height="26" rx="2" fill="#FF9A3D"/>
  </g>

  <!-- ===== РАБОЧАЯ ЛАМПА ===== -->
  <circle cx="1010" cy="235" r="95" fill="url(#glowG)"/>
  <ellipse cx="1048" cy="368" rx="52" ry="10" fill="#26323F" opacity="0.13" filter="url(#itemShadow)"/>
  <g>
    <!-- Кронштейн -->
    <rect x="1028" y="288" width="52" height="16" rx="8" fill="#5C6B7A" transform="rotate(38 1054 296)"/>
    <rect x="1052" y="336" width="44" height="14" rx="7" fill="#3A4958"/>
    <!-- Голова лампы -->
    <rect x="958" y="188" width="104" height="94" rx="20" fill="#3A4958"/>
    <rect x="962" y="192" width="40" height="86" rx="14" fill="#4A5A6C"/>
    <circle cx="1010" cy="235" r="34" fill="#F2B705"/>
    <circle cx="1010" cy="235" r="20" fill="#FFD873"/>
    <ellipse cx="1002" cy="224" rx="7" ry="5" fill="#FFFFFF" opacity="0.7" transform="rotate(-25 1002 224)"/>
    <!-- Кабель -->
    <path d="M962 214 C 930 214, 930 252, 908 252" fill="none" stroke="#2E3B4A" stroke-width="6" stroke-linecap="round"/>
    <circle cx="956" cy="220" r="4" fill="#8FA0B1"/>
  </g>

  <!-- ===== КРЕПЁЖ (болты, шайбы, гайки) ===== -->
  <g>
    <!-- Болт крупный -->
    <ellipse cx="1000" cy="438" rx="30" ry="8" fill="#26323F" opacity="0.14" filter="url(#itemShadow)"/>
    <rect x="994" y="390" width="12" height="36" rx="3" fill="#AEBAC6"/>
    <rect x="994" y="390" width="12" height="36" rx="3" fill="none" stroke="#8B97A3" stroke-width="1"/>
    <line x1="994" y1="402" x2="1006" y2="402" stroke="#8B97A3" stroke-width="1.5"/>
    <line x1="994" y1="412" x2="1006" y2="412" stroke="#8B97A3" stroke-width="1.5"/>
    <circle cx="1000" cy="380" r="18" fill="#8E9AA6"/>
    <circle cx="1000" cy="380" r="18" fill="none" stroke="#5C6B7A" stroke-width="2"/>
    <circle cx="1000" cy="380" r="8" fill="none" stroke="#6B7B8C" stroke-width="2"/>
    <!-- Шайба -->
    <circle cx="944" cy="404" r="16" fill="none" stroke="#8E9AA6" stroke-width="7"/>
    <circle cx="944" cy="404" r="4" fill="#E8EDF2"/>
    <!-- Гайка -->
    <polygon points="1062,398 1076,406 1076,422 1062,430 1048,422 1048,406" fill="#5C6B7A"/>
    <polygon points="1062,398 1076,406 1076,422 1062,430 1048,422 1048,406" fill="none" stroke="#48576A" stroke-width="2"/>
    <circle cx="1062" cy="414" r="5" fill="#3A4958"/>

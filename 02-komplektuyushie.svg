<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F7FA"/>
      <stop offset="1" stop-color="#DDE5ED"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C3CCD6"/>
      <stop offset="0.35" stop-color="#E8EDF2"/>
      <stop offset="0.7" stop-color="#D5DCE4"/>
      <stop offset="1" stop-color="#ADB8C4"/>
    </linearGradient>
    <linearGradient id="sideG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#87939F"/>
      <stop offset="1" stop-color="#A6B1BC"/>
    </linearGradient>
    <linearGradient id="topG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F7FA"/>
      <stop offset="1" stop-color="#C9D2DB"/>
    </linearGradient>
    <linearGradient id="glassG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BFE0EF"/>
      <stop offset="0.5" stop-color="#EAF5FB"/>
      <stop offset="1" stop-color="#A3CCE0"/>
    </linearGradient>
    <linearGradient id="glowG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB84D" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFB84D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rollG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A2A"/>
      <stop offset="1" stop-color="#E06400"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="itemShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="paneClip">
      <rect x="320" y="140" width="560" height="320" rx="24"/>
    </clipPath>
  </defs>

  <!-- Фон -->
  <rect width="1200" height="800" fill="url(#bgG)"/>
  <rect width="1200" height="800" fill="url(#bgGlow)"/>

  <!-- Декоративная сетка пола -->
  <g stroke="#B9C4CE" stroke-opacity="0.3" stroke-width="1">
    <line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="0" y1="740" x2="1200" y2="740" stroke-opacity="0.14"/>
    <line x1="780" y1="0" x2="690" y2="800" stroke-opacity="0.1"/>
    <line x1="1020" y1="0" x2="1000" y2="800" stroke-opacity="0.1"/>
    <line x1="1260" y1="0" x2="1310" y2="800" stroke-opacity="0.1"/>
  </g>

  <!-- Декоративные круги -->
  <circle cx="1050" cy="150" r="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="1050" cy="150" r="86" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="160" cy="640" r="130" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2"/>
  <circle cx="160" cy="640" r="102" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>

  <!-- ===== СТЕКЛО «ТРИПЛЕКС» ===== -->
  <ellipse cx="610" cy="512" rx="300" ry="26" fill="#26323F" opacity="0.13" filter="url(#itemShadow)"/>
  <g transform="rotate(-4 600 300)">
    <rect x="320" y="140" width="560" height="320" rx="24" fill="url(#glassG)"/>
    <g clip-path="url(#paneClip)">
      <rect x="348" y="168" width="504" height="264" rx="12" fill="#FFFFFF" opacity="0.35"/>
      <rect x="356" y="176" width="488" height="248" rx="10" fill="none" stroke="#8FB6C9" stroke-width="2" stroke-dasharray="12 10" opacity="0.75"/>
      <polygon points="352,196 660,150 690,158 384,204" fill="#FFFFFF" opacity="0.4"/>
      <polygon points="700,152 742,146 748,158 706,164" fill="#FFFFFF" opacity="0.3"/>
      <rect x="332" y="150" width="536" height="8" rx="4" fill="#FFFFFF" opacity="0.55"/>
      <path d="M320,436 H880 V456 Q880,480 856,480 H344 Q320,480 320,456 Z" fill="#24313F"/>
      <line x1="322" y1="434" x2="878" y2="434" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2"/>
    </g>
    <!-- Маркировка безопасности -->
    <rect x="812" y="418" width="46" height="32" rx="6" fill="#ED760E"/>
    <text x="835" y="440" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">3+3</text>
    <rect x="322" y="424" width="76" height="26" rx="5" fill="#F5F7FA" stroke="#AEBAC6" stroke-width="1.5"/>
    <text x="360" y="442" text-anchor="middle" font-size="12" font-weight="bold" fill="#4A5A6C">Триплекс</text>
  </g>

  <!-- ===== РУЛОН УПЛОТНИТЕЛЯ ===== -->
  <ellipse cx="238" cy="292" rx="78" ry="14" fill="#26323F" opacity="0.14" filter="url(#itemShadow)"/>
  <g>
    <circle cx="238" cy="205" r="64" fill="url(#rollG)"/>
    <circle cx="238" cy="205" r="45" fill="#C45500"/>
    <circle cx="238" cy="205" r="45" fill="none" stroke="#A84400" stroke-width="3" stroke-dasharray="5 9" opacity="0.7"/>
    <circle cx="238" cy="205" r="26" fill="#F7D9A8"/>
    <circle cx="238" cy="205" r="12" fill="#E8B878"/>
    <!-- Хвост уплотнителя -->
    <path d="M238 141 C 290 133, 322 162, 316 196 L 296 194 C 300 172, 278 154, 244 159 Z" fill="#FF9A3D" stroke="#E06400" stroke-width="2"/>
    <!-- Блик -->
    <ellipse cx="216" cy="178" rx="20" ry="12" fill="#FFFFFF" opacity="0.35" transform="rotate(-30 216 178)"/>
  </g>

  <!-- ===== ШЕСТИГРАННЫЙ КЛЮЧ ===== -->
  <ellipse cx="148" cy="268" rx="60" ry="10" fill="#26323F" opacity="0.12" filter="url(#itemShadow)"/>
  <g>
    <path d="M148 172 L148 246 L206 246" fill="none" stroke="#6B7B8C" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M148 172 L148 246 L206 246" fill="none" stroke="#93A1B0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <line x1="772" y1="300" x2="938" y2="300" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2"/>
    <!-- Кабель-канал -->
    <rect x="916" y="316" width="10" height="146" rx="5" fill="#5C6B7A"/>
    <circle cx="921" cy="338" r="2.5" fill="#2E3B4A"/>
    <circle cx="921" cy="390" r="2.5" fill="#2E3B4A"/>
    <circle cx="921" cy="442" r="2.5" fill="#2E3B4A"/>
    <!-- Панель -->
    <rect x="784" y="318" width="122" height="140" rx="10" fill="#24313F"/>
    <!-- Панель оператора (экран) -->
    <rect x="792" y="326" width="106" height="58" rx="8" fill="#101820"/>
    <rect x="800" y="334" width="90" height="42" rx="4" fill="#1E2B3A"/>
    <rect x="812" y="352" width="16" height="14" rx="2" fill="#53D769"/>
    <rect x="834" y="346" width="16" height="20" rx="2" fill="#53D769" opacity="0.8"/>
    <rect x="856" y="356" width="16" height="10" rx="2" fill="#53D769" opacity="0.6"/>
    <polyline points="812,366 824,358 836,362 848,350 860,354 872,346" fill="none" stroke="#7ADFFF" stroke-width="2"/>

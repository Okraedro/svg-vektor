  <!-- Подголовник -->
  <rect x="506" y="42" width="188" height="94" rx="34" fill="#3D4E60"/>
  <rect x="516" y="50" width="168" height="78" rx="28" fill="#4A5A6C"/>

  <g stroke="#24313F" stroke-width="2.5" stroke-dasharray="8 10" opacity="0.9">
    <line x1="552" y1="58" x2="552" y2="118"/>
    <line x1="648" y1="58" x2="648" y2="118"/>

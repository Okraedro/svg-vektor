    <circle cx="313" cy="340" r="7" fill="#35B05A"/>
    <circle cx="339" cy="340" r="7" fill="#F2B705"/>
    <circle cx="365" cy="340" r="7" fill="#E0453A"/>
    <circle cx="313" cy="340" r="2.5" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="339" cy="340" r="2.5" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="365" cy="340" r="2.5" fill="#FFFFFF" opacity="0.6"/>
    <!-- Переключатели -->
    <rect x="302" y="372" width="9" height="24" rx="4" fill="#3A4958"/>
    <rect x="389" y="372" width="9" height="24" rx="4" fill="#3A4958"/>
    <rect x="302" y="368" width="9" height="8" rx="3" fill="#E0453A"/>
    <rect x="389" y="384" width="9" height="8" rx="3" fill="#35B05A"/>
    <!-- Поворотный переключатель -->
    <circle cx="355" cy="384" r="11" fill="#F5F7FA" stroke="#AEBAC6" stroke-width="1.5"/>
    <line x1="355" y1="378" x2="355" y2="384" stroke="#4A5A6C" stroke-width="2.5"/>
    <line x1="349" y1="384" x2="355" y2="384" stroke="#4A5A6C" stroke-width="2.5"/>
    <!-- Аварийный грибок -->
    <circle cx="355" cy="426" r="21" fill="#E0453A"/>
    <circle cx="355" cy="426" r="12" fill="#A6302A"/>
    <circle cx="355" cy="426" r="4" fill="#7E2118"/>
    <!-- Сигнальная полоса -->
    <g clip-path="url(#colLClip)">
      <rect x="272" y="438" width="176" height="40" fill="url(#hazardPat)"/>
    </g>
  </g>

  <!-- Джойстик левый -->
  <g transform="rotate(10 345 285)">
    <path d="M325,262 L365,262 L360,292 L330,292 Z" fill="#24313F"/>
    <path d="M331,270 L337,270 L335,288 L332,288 Z" fill="#101820"/>
    <path d="M353,270 L359,270 L358,288 L354,288 Z" fill="#101820"/>
    <rect x="341" y="226" width="9" height="40" rx="3.5" fill="#D5DCE4"/>
    <rect x="346" y="228" width="3" height="36" rx="1.5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="327" y="180" width="37" height="52" rx="15" fill="#E0453A"/>
    <rect x="330" y="174" width="31" height="14" rx="6" fill="#101820"/>
    <rect x="332" y="190" width="11" height="26" rx="5" fill="#FFFFFF" opacity="0.3"/>
  </g>

  <!-- ===== ПРАВАЯ КОЛОНКА ===== -->
  <g>
    <rect x="770" y="298" width="150" height="174" rx="14" fill="url(#bodyG)"/>

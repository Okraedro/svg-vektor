  <!-- Гофра газ-лифта -->
  <rect x="564" y="516" width="72" height="148" rx="14" fill="#3A4958"/>
  <g stroke="#24313F" stroke-width="2">
    <line x1="568" y1="540" x2="632" y2="540"/>
    <line x1="568" y1="570" x2="632" y2="570"/>
    <line x1="568" y1="600" x2="632" y2="600"/>
    <line x1="568" y1="630" x2="632" y2="630"/>
  </g>
  <rect x="570" y="518" width="14" height="142" rx="7" fill="#4A5A6C"/>

    <rect x="856" y="228" width="3" height="36" rx="1.5" fill="#FFFFFF" opacity="0.6"/>
    <rect x="837" y="180" width="37" height="52" rx="15" fill="#ED760E"/>
    <rect x="840" y="174" width="31" height="14" rx="6" fill="#101820"/>
    <rect x="842" y="190" width="11" height="26" rx="5" fill="#FFFFFF" opacity="0.3"/>

    <line x1="628" y1="592" x2="628" y2="616"/>
    <line x1="664" y1="592" x2="664" y2="616"/>
    <line x1="700" y1="592" x2="700" y2="616"/>
    <line x1="736" y1="592" x2="736" y2="616"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F7FA"/>
      <stop offset="1" stop-color="#DDE5ED"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C3CCD6"/>
      <stop offset="0.35" stop-color="#E8EDF2"/>
      <stop offset="0.7" stop-color="#D5DCE4"/>
      <stop offset="1" stop-color="#ADB8C4"/>
    </linearGradient>
    <linearGradient id="topG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F7FA"/>
      <stop offset="1" stop-color="#C9D2DB"/>
    </linearGradient>
    <linearGradient id="chromeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F9FB"/>
      <stop offset="0.45" stop-color="#CFD7DF"/>
      <stop offset="0.55" stop-color="#9AA6B2"/>
      <stop offset="1" stop-color="#E3E9EF"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="ledGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <pattern id="hazardPat" x="0" y="0" width="60" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(-14)">
      <rect x="0" y="0" width="30" height="34" fill="#24313F"/>
      <rect x="30" y="0" width="30" height="34" fill="#F5B70A"/>
    </pattern>
    <clipPath id="colLClip">
      <rect x="280" y="298" width="150" height="174" rx="14"/>
    </clipPath>
    <clipPath id="colRClip">
      <rect x="770" y="298" width="150" height="174" rx="14"/>
    </clipPath>
  </defs>

  <!-- Фон -->
  <rect width="1200" height="800" fill="url(#bgG)"/>
  <rect width="1200" height="800" fill="url(#bgGlow)"/>

  <!-- Декоративная сетка пола -->
  <g stroke="#B9C4CE" stroke-opacity="0.3" stroke-width="1">
    <line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="0" y1="740" x2="1200" y2="740" stroke-opacity="0.14"/>
    <line x1="0" y1="780" x2="1200" y2="780" stroke-opacity="0.1"/>
    <line x1="160" y1="0" x2="60" y2="800" stroke-opacity="0.1"/>
    <line x1="560" y1="0" x2="530" y2="800" stroke-opacity="0.1"/>
    <line x1="960" y1="0" x2="1000" y2="800" stroke-opacity="0.1"/>
  </g>

  <!-- Декоративные круги -->
  <circle cx="220" cy="200" r="120" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2"/>
  <circle cx="220" cy="200" r="94" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="990" cy="170" r="95" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2"/>
  <circle cx="990" cy="170" r="74" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1"/>

  <!-- Тень -->
  <ellipse cx="600" cy="706" rx="330" ry="36" fill="#26323F" opacity="0.16" filter="url(#softShadow)"/>
  <ellipse cx="600" cy="706" rx="240" ry="26" fill="#26323F" opacity="0.12" filter="url(#softShadow)"/>

  <!-- Дуга разворота 350° -->
  <path d="M296,676 A 304 54 0 1 1 904,676" fill="none" stroke="#ED760E" stroke-opacity="0.45" stroke-width="4" stroke-dasharray="18 10"/>
  <polygon points="900,662 918,676 900,690" fill="#ED760E" opacity="0.6"/>
  <text x="928" y="682" font-size="17" font-weight="bold" fill="#ED760E" opacity="0.85">350°</text>

  <!-- ===== БАЗА ===== -->
  <ellipse cx="600" cy="692" rx="185" ry="30" fill="#87939F"/>
  <ellipse cx="600" cy="678" rx="185" ry="30" fill="url(#topG)"/>
  <ellipse cx="600" cy="678" rx="185" ry="30" fill="none" stroke="#9AA6B2" stroke-width="1.5"/>
  <g fill="#5C6B7A">
    <circle cx="785" cy="678" r="4.5"/>
    <circle cx="731" cy="657" r="4.5"/>
    <circle cx="600" cy="648" r="4.5"/>
    <circle cx="469" cy="657" r="4.5"/>
    <circle cx="415" cy="678" r="4.5"/>
    <circle cx="469" cy="699" r="4.5"/>
    <circle cx="600" cy="708" r="4.5"/>
    <circle cx="731" cy="699" r="4.5"/>
  </g>


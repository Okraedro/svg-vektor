    <!-- Лампы -->
    <circle cx="806" cy="404" r="6" fill="#35B05A"/>
    <circle cx="830" cy="404" r="6" fill="#F2B705"/>
    <circle cx="854" cy="404" r="6" fill="#E0453A"/>
    <circle cx="806" cy="404" r="2" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="830" cy="404" r="2" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="854" cy="404" r="2" fill="#FFFFFF" opacity="0.6"/>
       <!-- Сигнальная полоса -->
    <g clip-path="url(#colRClip)">
      <rect x="762" y="438" width="176" height="40" fill="url(#hazardPat)"/>
    </g>
  </g>

  <!-- Джойстик правый -->
  <g transform="rotate(-10 855 285)">
    <path d="M835,262 L875,262 L870,292 L840,292 Z" fill="#24313F"/>
    <path d="M841,270 L847,270 L845,288 L842,288 Z" fill="#101820"/>
    <path d="M863,270 L869,270 L868,288 L864,288 Z" fill="#101820"/>

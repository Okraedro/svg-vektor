  <rect x="586" y="428" width="28" height="92" rx="10" fill="url(#chromeG)"/>
  <rect x="590" y="432" width="6" height="84" rx="3" fill="#FFFFFF" opacity="0.7"/>
  <!-- Салазки регулировки -->
  <rect x="514" y="386" width="172" height="48" rx="12" fill="#5C6B7A"/>
  <rect x="526" y="398" width="148" height="24" rx="8" fill="#8E9AA6"/>
  <rect x="662" y="396" width="18" height="28" rx="4" fill="#ED760E"/>

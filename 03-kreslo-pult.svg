    <circle cx="279" cy="338" r="2.5" fill="#2E3B4A"/>
    <circle cx="279" cy="390" r="2.5" fill="#2E3B4A"/>
    <circle cx="279" cy="442" r="2.5" fill="#2E3B4A"/>
    <!-- Панель -->
